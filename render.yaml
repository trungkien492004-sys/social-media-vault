services:
  - type: web
    name: social-media-vault
    env: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: DEBUG
        value: "False"
      # Persistent storage (set these values in Render Dashboard > Environment; never commit them)
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: vault
      # Accounts (optional): INVITE_CODE limits who can sign up, USER_QUOTA_MB caps storage per user
      - key: INVITE_CODE
        sync: false
      - key: USER_QUOTA_MB
        value: 300
